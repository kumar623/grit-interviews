  var fbFail = {result:'fail', feedback:'Revise CS Fundamentals and how you would evaluate a Gen AI feature, then come back.', interviewer:'Priya Menon'};
  var fbRetake = {result:'retake', feedback:'Your connection dropped, so we could not finish.', interviewer:'Priya Menon'};
  var before = a === 'nullified'
